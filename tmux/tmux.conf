# Tmux Hierarchy is - Sessions ---> Windows ---> Panes

#Keybinding
unbind r
bind r source-file ~/.config/tmux/tmux.conf

#Important Global settings
set -g mouse on
set -g prefix C-a
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g allow-passthrough on
set -g pane-border-status top
set -g pane-border-format "#[align=centre]| #{pane_index} | #{pane_title} |"
set -g status-position bottom
set -g allow-rename off

#For transparency effects
set -g status-bg default
set -g status-left-style bg=default
set -g status-right-style bg=default

# For ricing purposes
set -g pane-border-lines heavy 
bind T choose-tree \
  -F "#{session_name} :: #{window_name} :: #{pane_current_command}"
set -g pane-active-border-style fg="#e3dc95"

#Setting some optimal keybinds
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

#Option for renaming panes
# bind R command-prompt -p "Target pane (Name or ID):","Rename to:" "select-pane -t '%1' -T '%2'"

#Set the environment variables
set-env -g TMUX_POWERLINE_CONFIG_FILE "$HOME/.config/tmux-powerline/config.sh"

# Tmux plugins init
set -g @plugin 'erikw/tmux-powerline'

#Script to run all the tmux plugins
run '~/.config/tmux/plugins/tpm/tpm'

#For some tests
bind-key R display-popup -T "Rename pane #{pane_index}" -E -w 12% -h 6% -b rounded "bash -c 'read title; tmux select-pane -T \"\$title\"'"

# For the AI agents
# Keep each CLI in its own persistent tmux session so popup scrollback survives reopenings.
bind-key L display-popup -T "Claude CLI" -E -w 60% -h 60% -b rounded "tmux has-session -t claude 2>/dev/null || tmux new-session -Ad -s claude -c '#{pane_current_path}' sh -lc 'exec claude'; tmux attach-session -t claude"
bind-key G display-popup -T "Antigravity CLI" -E -w 60% -h 60% -b rounded "tmux has-session -t antigravity 2>/dev/null || tmux new-session -Ad -s antigravity -c '#{pane_current_path}' sh -lc 'exec antigravity'; tmux attach-session -t antigravity"
bind-key C display-popup -T "Codex CLI" -E -w 60% -h 60% -b rounded "tmux has-session -t codex 2>/dev/null || tmux new-session -Ad -s codex -c '#{pane_current_path}' sh -lc 'exec codex'; tmux attach-session -t codex"

# Open a persistent scratchpad session in a popup so scrollback survives reopening
bind-key \\ display-popup -E -w 60% -h 60% -b rounded -T "  Scratchpad " "tmux has-session -t scratchpad 2>/dev/null || tmux new-session -Ad -s scratchpad -c '#{pane_current_path}' zsh; tmux attach-session -t scratchpad"
